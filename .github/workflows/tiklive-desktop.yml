name: TikLive Studio desktop builds

on:
  workflow_dispatch:
  push:
    paths:
      - 'tiklive/**'
      - '.github/workflows/tiklive-desktop.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tiklive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tiklive/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned builds
      - uses: actions/upload-artifact@v4
        with:
          name: tiklive-${{ runner.os }}
          path: |
            tiklive/dist/*.exe
            tiklive/dist/*.dmg
            tiklive/dist/*.AppImage
          if-no-files-found: error
